# The fork's own CI. Upstream's .circleci/config.yml stays untouched and
# does not run here: CircleCI is not set up for this repository.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same ref makes the running checks moot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lein-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13
        with:
          lein: latest
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('project.clj') }}
          restore-keys: m2-
      - run: lein test

  # src/repl holds the fork's managed-runtime suites, which need a running
  # shadow-cljs server and bun, so lein test (src/test only) never runs them.
  # They run through lein too, so both jobs test the release's own
  # dependencies rather than deps.edn's, which upstream lets drift.
  repl-tests:
    runs-on: ubuntu-latest
    # autorun-test and the managed runtimes wait on child processes with
    # no limit of their own
    timeout-minutes: 20
    env:
      # a runner without bun fails instead of passing every bun test vacuously
      REQUIRE_BUN: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13
        with:
          lein: latest
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('project.clj') }}
          restore-keys: m2-
      - run: >-
          lein with-profile +repl-tests run -m shadow.cljs.server-test-runner
          shadow.cljs.managed-runtime-test
          shadow.cljs.js-runtime-test
          shadow.cljs.bun-runtime-test
          shadow.cljs.test-util-test
          shadow.cljs.server-test-runner-test
